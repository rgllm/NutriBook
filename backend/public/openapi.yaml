openapi: 3.0.3
info:
  title: NutriBook API
  version: 1.0.0
  description: >
    JSON API behind the NutriBook frontend. Guests search nutritionists by
    name, service, and location. The request tests validate every documented
    response against this file, so it cannot drift from the code.
servers:
  - url: /
    description: This server
paths:
  /nutritionists:
    get:
      operationId: searchNutritionists
      summary: Search nutritionists
      description: >
        Matches part of a nutritionist's name or the name of one of their
        services at the location, ignoring case and accents. A blank or unknown
        location searches Braga, and `location.source` says which case applied.
        Results are ordered by name, five per page. A page past the end returns
        the last page, and a missing or invalid page returns the first. Each
        nutritionist lists only the services offered at the searched location,
        ordered by street address and then by name.
      tags: [Nutritionists]
      parameters:
        - name: q
          in: query
          description: Part of a nutritionist's name or of a service name.
          schema:
            type: string
          example: follow
        - name: location
          in: query
          description: City to search. `Lisbon` and `Oporto` are accepted as aliases.
          schema:
            type: string
          example: Braga
        - name: page
          in: query
          description: Results page, starting at 1.
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: One page of matching nutritionists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionistSearch"
  /appointment_requests:
    post:
      operationId: createAppointmentRequest
      summary: Request an appointment
      description: >
        Books a pending request with the nutritionist who offers the service.
        The day and time are Portuguese wall-clock time and must be a future
        slot: Monday to Saturday, on the hour, from 09:00 to 18:00 except
        13:00, and not overlapping the nutritionist's accepted appointments.
        A guest, identified by email, has at most one pending request, so this
        supersedes the guest's previous pending request.
      tags: [Appointment requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRequestInput"
      responses:
        "201":
          description: The pending request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRequest"
        "422":
          description: The request was not created. Messages are keyed by field and written for the guest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
  /locations:
    get:
      operationId: listLocations
      summary: List searchable cities
      description: >
        The cities with at least one service, once each and in alphabetical
        order, and the city a blank or unknown location searches.
      tags: [Locations]
      responses:
        "200":
          description: The known cities and the default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Locations"
components:
  schemas:
    NutritionistSearch:
      type: object
      additionalProperties: false
      required: [nutritionists, location, pagination]
      properties:
        nutritionists:
          type: array
          items:
            $ref: "#/components/schemas/Nutritionist"
        location:
          $ref: "#/components/schemas/ResolvedLocation"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Nutritionist:
      type: object
      additionalProperties: false
      required: [id, name, title, license_number, offers_online, services]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Mary Jane
        title:
          type: string
          enum: [Dietitian, Nutritionist]
        license_number:
          type: string
          example: 2963N
        offers_online:
          type: boolean
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
    Service:
      type: object
      additionalProperties: false
      required: [id, name, price, street_address, city, duration_minutes]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: First appointment
        price:
          type: string
          description: Decimal amount in euros, as a string to keep its precision.
          pattern: '^\d+\.\d+$'
          example: "25.0"
        street_address:
          type: string
          description: Where the service is given. One nutritionist can work at several addresses in the same city.
          example: Rua do Souto 45
        city:
          type: string
          example: Braga
        duration_minutes:
          type: integer
          minimum: 1
          example: 60
    ResolvedLocation:
      type: object
      additionalProperties: false
      required: [city, source]
      properties:
        city:
          type: string
          description: The city that was searched.
          example: Braga
        source:
          type: string
          description: >
            `input` when the requested location was known, `default` when it was
            blank, `fallback` when it was unknown.
          enum: [input, default, fallback]
    Pagination:
      type: object
      additionalProperties: false
      required: [page, per_page, total_count, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          example: 5
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
    Locations:
      type: object
      additionalProperties: false
      required: [locations, default]
      properties:
        locations:
          type: array
          items:
            type: string
          example: [Braga, Porto]
        default:
          type: string
          example: Braga
    AppointmentRequestInput:
      type: object
      additionalProperties: false
      required: [appointment_request]
      properties:
        appointment_request:
          type: object
          additionalProperties: false
          properties:
            service_id:
              type: integer
              example: 1
            guest_name:
              type: string
              example: Joana Silva
            guest_email:
              type: string
              example: joana.silva@example.com
            date:
              type: string
              description: Day in Portugal, as YYYY-MM-DD.
              example: "2026-12-07"
            time:
              type: string
              description: Slot start in Portugal, as HH:MM.
              example: "10:00"
            online:
              type: boolean
              description: Only allowed when the nutritionist offers online appointments.
    AppointmentRequest:
      type: object
      additionalProperties: false
      required: [id, status, guest_name, guest_email, starts_at, ends_at, online, service]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending]
        guest_name:
          type: string
          example: Joana Silva
        guest_email:
          type: string
          description: Stored lowercase.
          example: joana.silva@example.com
        starts_at:
          type: string
          format: date-time
          description: UTC.
          example: "2026-12-07T10:00:00.000Z"
        ends_at:
          type: string
          format: date-time
          description: The start plus the service's duration, in UTC.
          example: "2026-12-07T11:00:00.000Z"
        online:
          type: boolean
        service:
          type: object
          additionalProperties: false
          required: [id, name, street_address, city]
          properties:
            id:
              type: integer
            name:
              type: string
              example: First appointment
            street_address:
              type: string
              example: Rua do Souto 45
            city:
              type: string
              example: Braga
    ValidationErrors:
      type: object
      additionalProperties: false
      required: [errors]
      properties:
        errors:
          type: object
          description: Messages per field. Fields are service, guest_name, guest_email, starts_at, and online.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            starts_at: [Pick one of the available times.]
