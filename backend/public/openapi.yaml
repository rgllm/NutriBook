openapi: 3.0.3
info:
  title: NutriBook API
  version: 1.0.0
  description: >
    JSON API behind the NutriBook frontend. Guests search nutritionists by
    name, service, and location. Backend request assertions and frontend
    contract-checked fixtures validate the exercised requests and JSON responses
    against this file. Untested behavior and fixtures that explicitly opt out
    are not covered.
servers:
  - url: /
    description: This server
paths:
  /nutritionists:
    get:
      operationId: searchNutritionists
      summary: Search nutritionists
      description: >
        Searches nutritionist names and the names of services offered at the
        location. Typed queries use Meilisearch with typo tolerance, token matching,
        prefix matching on the last word, and relevance ranking. The requested name sort
        applies at Meilisearch's sort ranking rule, after earlier relevance
        rules; it does not guarantee globally alphabetical results.
        Without a query, or if Meilisearch is unavailable, SQL uses case- and
        accent-insensitive substring matching and orders by name then id.
        SQL has no typo tolerance, so fallback results can differ.
        A blank or unknown location searches Braga, and `location.source` says
        which case applied. Results contain five nutritionists per page.
        A page past the end returns the last page, and a missing or invalid
        page returns the first. Each nutritionist lists only the services offered
        at the searched location,
        ordered by street address and then by name.
      tags: [Nutritionists]
      parameters:
        - name: q
          in: query
          description: Nutritionist or service search text. Matching depends on the search engine described above.
          schema:
            type: string
          example: follow
        - name: location
          in: query
          description: City to search. `Lisbon` and `Oporto` are accepted as aliases.
          schema:
            type: string
          example: Braga
        - name: page
          in: query
          description: Results page, starting at 1.
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: One page of matching nutritionists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionistSearch"
  /appointment_requests:
    post:
      operationId: createAppointmentRequest
      summary: Request an appointment
      description: >
        Books a pending request with the nutritionist who offers the service.
        The day and time are Portuguese wall-clock time and must be a future
        slot: Monday to Saturday, on the hour, from 09:00 to 18:00 except
        13:00, and not overlapping the nutritionist's accepted appointments.
        A guest, identified by email, has at most one pending request, so this
        supersedes the guest's previous pending request.
      tags: [Appointment requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRequestInput"
      responses:
        "201":
          description: The pending request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRequest"
        "400":
          description: The appointment_request envelope is missing, empty, or not an object with permitted fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "422":
          description: The request was not created. Error codes are keyed by field; the client words them for the guest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
  /nutritionists/{id}/appointment_requests:
    get:
      operationId: listPendingAppointmentRequests
      summary: List a nutritionist's pending requests
      description: >
        The nutritionist and every request still waiting for their answer,
        soonest first. Requests whose time has passed stay in the list until
        the nutritionist answers them.
      tags: [Appointment requests]
      parameters:
        - name: id
          in: path
          required: true
          description: >
            The nutritionist's id, digits only with no leading zero. Any other
            value matches no route and returns 404 without a body schema.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
          example: "1"
      responses:
        "200":
          description: The nutritionist and their pending requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAppointmentRequests"
        "404":
          description: No nutritionist has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /nutritionists/{nutritionist_id}/appointment_requests/{id}:
    patch:
      operationId: answerAppointmentRequest
      summary: Accept or reject a request
      description: >
        The nutritionist answers one of their pending requests. Accepting also
        rejects every other pending request of the nutritionist that overlaps
        it in time, and lists their ids in `rejected_ids`. Requests whose time
        has passed can still be answered.
      tags: [Appointment requests]
      parameters:
        - name: nutritionist_id
          in: path
          required: true
          description: >
            The nutritionist's id, digits only with no leading zero. Any other
            value matches no route and returns 404 without a body schema.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
          example: "1"
        - name: id
          in: path
          required: true
          description: The request's id, in the same format as the nutritionist's.
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
          example: "7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRequestAnswer"
      responses:
        "200":
          description: The answered request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnsweredAppointmentRequest"
        "404":
          description: The nutritionist has no request with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "409":
          description: >
            The request cannot take this answer. It was already answered or
            superseded, or accepting it would overlap an accepted appointment.
            `status` is the request's current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerConflict"
        "400":
          description: The appointment_request envelope is missing, empty, or not an object with permitted fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "422":
          description: The status is not `accepted` or `rejected`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
  /locations:
    get:
      operationId: listLocations
      summary: List searchable cities
      description: >
        The cities with at least one service, once each and in alphabetical
        order, and the city a blank or unknown location searches.
      tags: [Locations]
      responses:
        "200":
          description: The known cities and the default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Locations"
  /locations/nearest:
    get:
      operationId: nearestLocation
      summary: Find the searchable city nearest a point
      description: >
        The city with at least one service whose centre is closest to the
        point, by great-circle distance. The search form uses it to fill the
        location from the browser's position.
      tags: [Locations]
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: string
            example: "41.55"
        - name: longitude
          in: query
          required: true
          schema:
            type: string
            example: "-8.43"
      responses:
        "200":
          description: The nearest city.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearestLocation"
        "404":
          description: No city has a service yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "422":
          description: A coordinate is missing, not a number, or out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
components:
  schemas:
    NutritionistSearch:
      type: object
      additionalProperties: false
      required: [nutritionists, location, pagination]
      properties:
        nutritionists:
          type: array
          items:
            $ref: "#/components/schemas/Nutritionist"
        location:
          $ref: "#/components/schemas/ResolvedLocation"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Nutritionist:
      type: object
      additionalProperties: false
      required: [id, name, title, license_number, offers_online, services]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Mary Jane
        title:
          type: string
          enum: [Dietitian, Nutritionist]
        license_number:
          type: string
          example: 2963N
        offers_online:
          type: boolean
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
    Service:
      type: object
      additionalProperties: false
      required: [id, name, price, street_address, city, duration_minutes]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: First appointment
        price:
          type: string
          description: Decimal amount in euros, as a string to keep its precision.
          pattern: '^\d+\.\d+$'
          example: "25.0"
        street_address:
          type: string
          description: Where the service is given. One nutritionist can work at several addresses in the same city.
          example: Rua do Souto 45
        city:
          type: string
          example: Braga
        duration_minutes:
          type: integer
          minimum: 1
          example: 60
    ResolvedLocation:
      type: object
      additionalProperties: false
      required: [city, source]
      properties:
        city:
          type: string
          description: The city that was searched.
          example: Braga
        source:
          type: string
          description: >
            `input` when the requested location was known, `default` when it was
            blank, `fallback` when it was unknown.
          enum: [input, default, fallback]
    Pagination:
      type: object
      additionalProperties: false
      required: [page, per_page, total_count, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          example: 5
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
    Locations:
      type: object
      additionalProperties: false
      required: [locations, default]
      properties:
        locations:
          type: array
          items:
            type: string
          example: [Braga, Porto]
        default:
          type: string
          example: Braga
    NearestLocation:
      type: object
      additionalProperties: false
      required: [city]
      properties:
        city:
          type: string
          example: Braga
    AppointmentRequestInput:
      type: object
      additionalProperties: false
      required: [appointment_request]
      properties:
        appointment_request:
          type: object
          additionalProperties: false
          properties:
            service_id:
              type: integer
              example: 1
            guest_name:
              type: string
              description: At most 100 characters; a longer name is a 422.
              example: Joana Silva
            guest_email:
              type: string
              description: At most 254 characters, with a dot in the domain; anything else is a 422.
              example: joana.silva@example.com
            date:
              type: string
              description: Day in Portugal, as YYYY-MM-DD.
              example: "2026-12-07"
            time:
              type: string
              description: Slot start in Portugal, as HH:MM.
              example: "10:00"
            online:
              type: boolean
              description: Only allowed when the nutritionist offers online appointments.
    AppointmentRequest:
      type: object
      additionalProperties: false
      required: [id, status, guest_name, guest_email, starts_at, ends_at, online, service]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending]
        guest_name:
          type: string
          maxLength: 100
          example: Joana Silva
        guest_email:
          type: string
          maxLength: 254
          description: Stored lowercase.
          example: joana.silva@example.com
        starts_at:
          type: string
          format: date-time
          description: UTC.
          example: "2026-12-07T10:00:00.000Z"
        ends_at:
          type: string
          format: date-time
          description: The start plus the service's duration, in UTC.
          example: "2026-12-07T11:00:00.000Z"
        online:
          type: boolean
        service:
          type: object
          additionalProperties: false
          required: [id, name, street_address, city]
          properties:
            id:
              type: integer
            name:
              type: string
              example: First appointment
            street_address:
              type: string
              example: Rua do Souto 45
            city:
              type: string
              example: Braga
    AppointmentRequestAnswer:
      type: object
      additionalProperties: false
      required: [appointment_request]
      properties:
        appointment_request:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              example: accepted
    AnsweredAppointmentRequest:
      type: object
      additionalProperties: false
      required: [id, status, answered_at, rejected_ids]
      properties:
        id:
          type: integer
          example: 7
        status:
          type: string
          enum: [accepted, rejected]
        answered_at:
          type: string
          format: date-time
          description: UTC.
          example: "2026-11-20T12:00:00.000Z"
        rejected_ids:
          type: array
          description: Overlapping requests rejected because this one was accepted. Empty on a rejection.
          items:
            type: integer
          example: [9]
    AnswerConflict:
      type: object
      additionalProperties: false
      required: [error, status]
      properties:
        error:
          type: string
          description: Why the request cannot take the answer, as a code the client words for the nutritionist.
          enum: [already_accepted, already_rejected, superseded, overlaps_accepted]
          example: already_accepted
        status:
          type: string
          enum: [pending, accepted, rejected, superseded]
    ValidationErrors:
      type: object
      additionalProperties: false
      required: [errors]
      properties:
        errors:
          type: object
          description: >
            Error codes per field, for the client to word in the user's language.
            service: blank. guest_name: blank, too_long. guest_email: blank,
            too_long, invalid. starts_at: blank, past, not_a_slot, taken.
            online: not_offered. status: not_an_answer.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            starts_at: [not_a_slot]
    PendingAppointmentRequests:
      type: object
      additionalProperties: false
      required: [nutritionist, appointment_requests]
      properties:
        nutritionist:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Mary Jane
        appointment_requests:
          type: array
          items:
            $ref: "#/components/schemas/PendingAppointmentRequest"
    PendingAppointmentRequest:
      type: object
      additionalProperties: false
      required: [id, guest_name, guest_email, starts_at, ends_at, online, service]
      properties:
        id:
          type: integer
        guest_name:
          type: string
          maxLength: 100
          example: Rita Gomes
        guest_email:
          type: string
          maxLength: 254
          example: rita.gomes@example.com
        starts_at:
          type: string
          format: date-time
          description: UTC.
          example: "2026-12-01T10:00:00.000Z"
        ends_at:
          type: string
          format: date-time
          description: UTC.
          example: "2026-12-01T11:00:00.000Z"
        online:
          type: boolean
        service:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
              example: First appointment
    InvalidRequest:
      type: object
      additionalProperties: false
      required: [error, parameter]
      properties:
        error:
          type: string
          enum: [invalid_request]
        parameter:
          type: string
          example: appointment_request
    NotFound:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          example: Nutritionist not found
