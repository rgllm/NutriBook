default: &default
  variables:
    pg_trgm.word_similarity_threshold: 0.4
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "nutribook") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: nutribook_development

test:
  <<: *default
  database: nutribook_test

production:
  <<: *default
  database: nutribook_production
