services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3000"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: nutribook
      DATABASE_PASSWORD: nutribook
    volumes:
      - ./backend:/rails
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).code == '200' ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nutribook
      POSTGRES_PASSWORD: nutribook
      POSTGRES_DB: nutribook_development
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutribook -d nutribook_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
