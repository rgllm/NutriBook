services:
  # The Next.js dev server, with hot reload from the mounted source. It calls
  # Rails over the Compose network.
  frontend:
    build: ./frontend
    # Rebuild on every `up`, so a dependency change needs no --build flag.
    pull_policy: build
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      API_URL: http://backend:3000
    volumes:
      - ./frontend:/app
      # Keep the image's Linux dependencies and the container's build output
      # apart from any host install.
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    pull_policy: build
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3000"
    environment:
      RAILS_ENV: development
      # Lets the frontend container reach Rails by its service name.
      RAILS_DEVELOPMENT_HOSTS: backend
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: nutribook
      DATABASE_PASSWORD: nutribook
      SOLID_QUEUE_IN_PUMA: "1"
      SMTP_ADDRESS: mailpit
      SMTP_PORT: 1025
    volumes:
      - ./backend:/rails
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).code == '200' ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nutribook
      POSTGRES_PASSWORD: nutribook
      POSTGRES_DB: nutribook_development
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutribook -d nutribook_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the backend sends; read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"


volumes:
  postgres_data:
